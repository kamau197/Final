
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 25px;
      color: #cbd5f5;
    }

    a {
      text-decoration: none;
      padding: 12px 28px;
      background: #3b82f6;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    a:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome</h1>
    <p>Please sign in to continue</p>
    <a href="signup.html">Sign up</a>
    <a href="login.html">Go to Login</a>
  </div>

</body>
</html>
