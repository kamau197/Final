<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #8e44ad, #6a0dad);
      color: #fff;
      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 50px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
      animation: fadeIn 2s ease forwards;
    }

    .btn {
      text-decoration: none;
      color: #fff;
      background: linear-gradient(45deg, #9b59b6, #8e44ad);
      padding: 15px 35px;
      margin: 15px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.2rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s, background 0.5s;
    }

    .btn:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      background: linear-gradient(45deg, #d06afc, #8e44ad);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Optional: Animated floating shapes */
    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.2;
      animation: float 10s infinite;
    }

    .shape1 { width: 200px; height: 200px; background: #9b59b6; top: 10%; left: 5%; }
    .shape2 { width: 150px; height: 150px; background: #8e44ad; bottom: 15%; right: 10%; }

    @keyframes float {
      0% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-30px) translateX(20px); }
      100% { transform: translateY(0) translateX(0); }
    }
  </style>
</head>
<body>
  <div class="shape shape1"></div>
  <div class="shape shape2"></div>

  <h1>Welcome</h1>
  <a href="login.html" class="btn">Go to Login</a>
  <a href="signup.html" class="btn">Go to Sign Up</a>
</body>
</html>
